name: CI

on:
  push:
    branches: ['**']
    # Docs-only pushes don't need tests or a deploy (2026-10-05: a burst of doc/debug
    # pushes produced 8 overlapping deploys in 20 minutes, which left prod stopped).
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    # Run the suite under both UTC and a UTC-negative zone. GitHub runners default to UTC,
    # which MASKS timezone bugs (date/day-of-week math that only diverges off-UTC). Running
    # America/Los_Angeles too catches that whole class before it reaches prod (the app's
    # default user timezone is America/Los_Angeles).
    strategy:
      fail-fast: false
      matrix:
        tz: ['UTC', 'America/Los_Angeles']
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (TZ=${{ matrix.tz }})
        run: npm test
        env:
          NODE_ENV: test
          DB_PATH: ':memory:'
          JWT_SECRET: ci-test-secret
          TZ: ${{ matrix.tz }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # One deploy at a time. Overlapping deploys left the replacement machine created but
    # stopped (2026-10-05), so prod sat idle until a request woke it.
    concurrency:
      group: fly-deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          V=$(git rev-parse --short HEAD)-$(date +%s)
          echo "BUILD_VERSION=$V" >> "$GITHUB_ENV"
          flyctl deploy --remote-only --build-arg BUILD_VERSION=$V
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # min_machines_running=1 should guarantee this, but a deploy has left the only
      # machine stopped before. Start anything stopped, then prove the app answers.
      - name: Make sure prod is running
        run: |
          for id in $(flyctl machines list --json | jq -r '.[] | select(.state=="stopped") | .id'); do
            echo "Starting stopped machine $id"; flyctl machine start "$id"
          done
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors https://butterflai.fly.dev/health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The agent makes a real (free) Anthropic call at startup and logs the result with
      # its version. "Healthy" isn't enough: on 2026-10-06 prod was healthy while every
      # Claude call failed (EACCES on the Fly OIDC socket). Fail the deploy loudly instead.
      - name: Verify Anthropic auth in the new release
        run: |
          for i in $(seq 1 18); do
            logs=$(flyctl logs --no-tail 2>/dev/null || true)
            if echo "$logs" | grep -F "ANTHROPIC AUTH FAILED" | grep -qF "version $BUILD_VERSION"; then
              echo "$logs" | grep -F "ANTHROPIC AUTH FAILED" | tail -1; exit 1
            fi
            if echo "$logs" | grep -F "Anthropic auth verified" | grep -qF "version $BUILD_VERSION"; then
              echo "$logs" | grep -F "Anthropic auth verified" | tail -1; exit 0
            fi
            sleep 10
          done
          echo "No auth verification line for $BUILD_VERSION after 3 minutes"; exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
