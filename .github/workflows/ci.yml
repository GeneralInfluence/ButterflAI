name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    # Run the suite under both UTC and a UTC-negative zone. GitHub runners default to UTC,
    # which MASKS timezone bugs (date/day-of-week math that only diverges off-UTC). Running
    # America/Los_Angeles too catches that whole class before it reaches prod (the app's
    # default user timezone is America/Los_Angeles).
    strategy:
      fail-fast: false
      matrix:
        tz: ['UTC', 'America/Los_Angeles']
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (TZ=${{ matrix.tz }})
        run: npm test
        env:
          NODE_ENV: test
          DB_PATH: ':memory:'
          JWT_SECRET: ci-test-secret
          TZ: ${{ matrix.tz }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --build-arg BUILD_VERSION=$(git rev-parse --short HEAD)-$(date +%s)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
