<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Triage · ButterflAI</title>
<style>
  :root {
    --bg: #f2f0fb; --surface: #fff; --ink: #1b1a22; --muted: #6c6880; --faint: #9a95ad;
    --line: #e6e2f3; --accent: #6c47ff; --accent-strong: #5a38d9; --accent-soft: #ece7fe;
    --new: #6c47ff; --triaged: #f59e0b; --fixed: #34c759;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0; }
  .back { font-size: 13px; color: var(--accent-strong); text-decoration: none; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .empty { color: var(--faint); text-align: center; padding: 40px 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(28,20,60,.06); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .pill { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 3px 9px; border-radius: 999px; color: #fff; }
  .pill.new { background: var(--new); } .pill.triaged { background: var(--triaged); } .pill.fixed { background: var(--fixed); }
  .meta { font-size: 12px; color: var(--faint); font-family: ui-monospace, monospace; }
  .note { font-size: 15px; background: var(--accent-soft); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; white-space: pre-wrap; }
  .note.empty-note { background: #f7f7fb; border-left-color: var(--faint); color: var(--faint); font-style: italic; }
  .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 12px 0 4px; }
  .reply { font-size: 14px; color: var(--ink); background: #f7f7fb; border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 13px; color: var(--accent-strong); }
  .turns { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .turn { padding: 7px 11px; font-size: 13px; border-top: 1px solid var(--line); }
  .turn:first-child { border-top: none; }
  .turn .who { font-family: ui-monospace, monospace; font-size: 11px; color: var(--faint); display: block; }
  .turn.user .who { color: var(--accent-strong); }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.repro { margin-left: auto; background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🦋 Feedback triage</h1>
    <a class="back" href="/admin">← Admin</a>
  </header>
  <p class="sub">Testers' flags on agent replies. Read the note, reproduce it in the simulator, fix, then mark fixed.</p>
  <div class="tabs" id="tabs">
    <button class="tab active" data-status="">All</button>
    <button class="tab" data-status="new">New</button>
    <button class="tab" data-status="triaged">Triaged</button>
    <button class="tab" data-status="fixed">Fixed</button>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
  let current = '';
  const listEl = document.getElementById('list');
  const toastEl = document.getElementById('toast');

  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1600);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function ago(sec) {
    const d = Math.floor(Date.now() / 1000) - sec;
    if (d < 60) return 'just now';
    if (d < 3600) return Math.floor(d / 60) + 'm ago';
    if (d < 86400) return Math.floor(d / 3600) + 'h ago';
    return Math.floor(d / 86400) + 'd ago';
  }
  function parseTurns(json) { try { return JSON.parse(json || '[]'); } catch (_) { return []; } }

  function simScript(fb) {
    const turns = parseTurns(fb.context_json).filter(t => t.role === 'user');
    const lines = turns.map(t => 'a: ' + String(t.text || '').replace(/\s+/g, ' ').trim()).filter(l => l.length > 3);
    return `# repro of feedback #${fb.id} (model ${fb.model || '?'})\n`
      + `# flagged reply: ${String(fb.agent_message || '').replace(/\s+/g, ' ').slice(0, 120)}\n`
      + `# note: ${String(fb.user_note || '(none)').replace(/\s+/g, ' ')}\n`
      + (lines.length ? lines.join('\n') : '# (no user turns were captured)') + '\n';
  }

  async function setStatus(id, status, card) {
    const r = await fetch('/api/admin/feedback/' + id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status })
    });
    if (r.ok) {
      card.querySelector('.pill').className = 'pill ' + status;
      card.querySelector('.pill').textContent = status;
      card.querySelectorAll('.btn.status').forEach(b => b.classList.toggle('on', b.dataset.status === status));
      toast('Marked ' + status);
      if (current && current !== status) card.remove();
    } else toast('Update failed');
  }

  async function copyRepro(fb) {
    const text = simScript(fb);
    try { await navigator.clipboard.writeText(text); toast('Sim input copied — paste into npm run sim'); }
    catch (_) { toast('Copy failed — select manually'); console.log(text); }
  }

  function render(items) {
    if (!items.length) { listEl.innerHTML = '<div class="empty">Nothing here.</div>'; return; }
    listEl.innerHTML = '';
    for (const fb of items) {
      const card = document.createElement('div');
      card.className = 'card';
      const turns = parseTurns(fb.context_json);
      const turnsHtml = turns.length
        ? '<div class="turns">' + turns.map(t =>
            `<div class="turn ${t.role === 'user' ? 'user' : ''}"><span class="who">${esc(t.role)}</span>${esc(t.text)}</div>`).join('') + '</div>'
        : '<div class="turn">(no context captured)</div>';
      card.innerHTML = `
        <div class="card-head">
          <span class="pill ${esc(fb.status)}">${esc(fb.status)}</span>
          <span class="meta">#${fb.id} · ${ago(fb.created_at)} · ${esc(fb.model || 'model?')}</span>
        </div>
        <div class="note ${fb.user_note ? '' : 'empty-note'}">${fb.user_note ? esc(fb.user_note) : 'No note — just flagged.'}</div>
        <div class="label">Flagged reply</div>
        <div class="reply">${esc(fb.agent_message) || '(empty)'}</div>
        <details><summary>Conversation context (${turns.length})</summary>${turnsHtml}</details>
        <div class="actions">
          <button class="btn status ${fb.status === 'new' ? 'on' : ''}" data-status="new">New</button>
          <button class="btn status ${fb.status === 'triaged' ? 'on' : ''}" data-status="triaged">Triaged</button>
          <button class="btn status ${fb.status === 'fixed' ? 'on' : ''}" data-status="fixed">Fixed</button>
          <button class="btn repro">Copy sim input</button>
        </div>`;
      card.querySelectorAll('.btn.status').forEach(b =>
        b.addEventListener('click', () => setStatus(fb.id, b.dataset.status, card)));
      card.querySelector('.btn.repro').addEventListener('click', () => copyRepro(fb));
      listEl.appendChild(card);
    }
  }

  async function load() {
    listEl.innerHTML = '<div class="empty">Loading…</div>';
    const q = current ? ('?status=' + current) : '';
    const r = await fetch('/api/admin/feedback' + q);
    if (!r.ok) { listEl.innerHTML = '<div class="empty">Not authorized.</div>'; return; }
    const { feedback } = await r.json();
    render(feedback || []);
  }

  document.getElementById('tabs').addEventListener('click', e => {
    if (!e.target.classList.contains('tab')) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    current = e.target.dataset.status;
    load();
  });

  load();
</script>
</body>
</html>
