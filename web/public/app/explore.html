<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ButterflAI">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <meta name="theme-color" content="#6c47ff">
  <title>ButterflAI — Explore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <!-- 🧭 Explore (owner, 2026-10-20: "these suggestions should become a feed, a social feed … their own
       tab along the bottom … never-ending … constantly being populated with stuff that Butterfly has
       found in their area or other people are up to"; named Explore; 🐛 #39: "an image there sort of
       like an Instagram feed … just copy that except for the sounds nice and make it a plan").
       ideafeed.js serves it a page at a time: Right now as a row of stories, then picture posts. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f2f2f7; color: #1c1c1e; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; padding: 0 16px; height: 52px; gap: 12px; position: sticky; top: 0; z-index: 10; }
    .logo { font-size: 20px; font-weight: 700; }
    header .sub { font-size: 13px; color: #8e8e93; }
    header nav { margin-left: auto; display: flex; gap: 20px; }
    header nav a { font-size: 14px; color: #6c47ff; text-decoration: none; font-weight: 500; }
    main { max-width: 600px; margin: 0 auto; padding: 12px 16px 32px; }
    /* Right now: a row of stories along the top */
    .stories { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: none; }
    .stories::-webkit-scrollbar { display: none; }
    .story { flex: 0 0 auto; width: 70px; text-align: center; background: none; border: none; font: inherit; cursor: pointer; color: #1c1c1e; }
    .story .ring { width: 64px; height: 64px; border-radius: 50%; padding: 3px; background: linear-gradient(45deg, #f59e0b, #ef4444, #6c47ff); margin: 0 auto; }
    .story .face { width: 100%; height: 100%; border-radius: 50%; background: #fff; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .story .name { font-size: 11px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: #fff; width: 100%; max-width: 600px; border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
    /* Posts, Instagram-style: header, picture, actions, caption */
    .post { background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; overflow: hidden; }
    .post-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: #ede9fe; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .who { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
    .who small { display: block; font-weight: 400; color: #8e8e93; font-size: 12px; }
    .pic { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #f2f2f7; overflow: hidden; }
    .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px; text-align: center; color: #fff; }
    .tile .big { font-size: 72px; line-height: 1; }
    .tile .t { font-size: 24px; font-weight: 700; line-height: 1.25; text-shadow: 0 1px 2px rgba(0,0,0,.15); }
    .g-nearby { background: linear-gradient(135deg, #6c47ff, #ec4899); }
    .g-new { background: linear-gradient(135deg, #10b981, #3b82f6); }
    .g-reconnect { background: linear-gradient(135deg, #f59e0b, #ef4444); }
    .g-wish { background: linear-gradient(135deg, #a78bfa, #6c47ff); }
    .actions { display: flex; align-items: center; gap: 8px; padding: 10px 12px 2px; flex-wrap: wrap; }
    .act { border: 1px solid #e5e5e5; background: #fff; color: #1c1c1e; border-radius: 999px; padding: 7px 11px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .act.on { background: #ede9fe; border-color: #6c47ff; color: #6c47ff; }
    .act.link { margin-left: auto; border: none; color: #6c47ff; font-weight: 500; text-decoration: none; padding: 8px 4px; }
    .liked { font-size: 14px; font-weight: 600; padding: 6px 12px 0; }
    .caption { font-size: 14px; line-height: 1.4; padding: 4px 12px 14px; }
    .caption b { font-weight: 600; }
    .caption span { color: #3a3a3c; }
    .x { background: none; border: none; color: #8e8e93; font-size: 18px; cursor: pointer; padding: 4px; }
    .sub { font-size: 13px; color: #8e8e93; margin-top: 3px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip { border: 1px solid #e5e5e5; background: #fff; color: #1c1c1e; border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
    .chip.on { background: #ede9fe; border-color: #6c47ff; color: #6c47ff; }
    .chip.static { cursor: default; }
    /* Always there while you scroll, just under the header (Sean: "I didn't realize that it was all the way at the top"). */
    .ask { display: flex; gap: 8px; position: sticky; top: 52px; z-index: 9; background: #f2f2f7; margin: 0 -16px 12px; padding: 8px 16px; box-shadow: 0 1px 0 #e5e5e5; }
    .ask input { flex: 1; min-width: 0; height: 40px; border: 1.5px solid #e5e5e5; border-radius: 999px; padding: 0 14px; font: inherit; font-size: 16px; background: #fff; }
    .ask input:focus { outline: none; border-color: #6c47ff; }
    .ask button { flex: none; border: none; background: #6c47ff; color: #fff; border-radius: 999px; padding: 0 16px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .asked-head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin: 0 2px 10px; }
    .asked-head button { margin-left: auto; background: none; border: none; color: #8e8e93; font-size: 16px; cursor: pointer; }
    .comment { display: none; gap: 6px; padding: 4px 12px 12px; }
    .post.commenting .comment { display: flex; }
    .comment input { flex: 1; min-width: 0; height: 36px; border: 1.5px solid #e5e5e5; border-radius: 999px; padding: 0 12px; font: inherit; font-size: 16px; }
    .comment button { flex: none; border: none; background: #6c47ff; color: #fff; border-radius: 999px; padding: 0 14px; font: inherit; font-size: 14px; cursor: pointer; }
    .facts { font-size: 13px; color: #3a3a3c; padding: 0 12px 2px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .src { font-size: 12px; color: #8e8e93; padding: 0 12px 12px; }
    .view-switch { margin-left: auto; display: flex; background: #f2f2f7; border-radius: 999px; padding: 3px; }
    .view-switch button { border: none; background: none; font: inherit; font-size: 14px; font-weight: 600; color: #3a3a3c; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
    .view-switch button.on { background: #fff; color: #6c47ff; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    #map { height: calc(100vh - 52px - 58px - env(safe-area-inset-bottom, 0px)); width: 100%; }
    .legend { position: absolute; z-index: 500; left: 12px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); background: #fff; border-radius: 12px; padding: 8px 10px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    .legend .bar { width: 150px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #34c759, #6c47ff); margin: 4px 0 2px; }
    .legend .ends { display: flex; justify-content: space-between; color: #8e8e93; }
    .status { text-align: center; color: #8e8e93; font-size: 14px; padding: 18px 8px 30px; }
    #sentinel { height: 1px; }
    .bottom-nav { display: none; }
    @media (max-width: 640px) {
      header nav { display: none; }
      body main { padding-bottom: calc(58px + env(safe-area-inset-bottom, 0px) + 32px); }
      .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 58px; background: #fff; border-top: 1px solid #e5e5e5;
        z-index: 100; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
      .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 500; color: #888; text-decoration: none; min-width: 48px; padding: 6px 2px; border-radius: 8px; }
      .bottom-nav a.active { color: #6c47ff; }
      .bottom-nav .tab-icon { font-size: 22px; line-height: 1; }
    }
  </style>
</head>
<body>
<header>
  <span class="logo">🧭 Explore</span>
  <div class="view-switch" role="tablist"><button id="v-list" class="on" onclick="showView('list')">List</button><button id="v-map" onclick="showView('map')">Map</button></div>
  <nav style="margin-left:16px"><a href="/app/dashboard">Home</a><a href="/app/chat">Plans</a><a href="/app/settings">Settings</a></nav>
</header>
<div id="map-wrap" hidden><div id="map"></div><div class="legend">When<div class="bar"></div><div class="ends"><span>Today</span><span>2+ weeks</span></div><div style="margin-top:4px;color:#8e8e93">● grey: no date</div></div></div>
<main id="list-view">
  <!-- 🔎 Search for something, or steer what you see (🐛 #50) -->
  <form class="ask" id="ask" onsubmit="event.preventDefault(); askExplore();"><input id="ask-text" maxlength="200" placeholder="🔎 Search or steer your ideas" aria-label="Look for something or steer your ideas"><button type="submit">Go</button></form>
  <div id="asked"></div>
  <div class="stories" id="stories" hidden></div>
  <!-- Out and about — the same panel as Home's Feeling, starting as one line here (🐛 #40). -->
  <div id="out-now" data-compact="1"></div>
  <div id="feed"></div>
  <div id="sentinel"></div>
  <div class="status" id="status">Loading…</div>
</main>

<nav class="bottom-nav">
  <a href="/app/dashboard"><span class="tab-icon">🏠</span>Home</a>
  <a href="/app/explore" class="active"><span class="tab-icon">🧭</span>Explore</a>
  <a href="/app/chat" onclick="try{var u=localStorage.getItem('bfly-plans-last');if(u&&u.indexOf('/app/')===0){location.href=u;return false}}catch(e){}"><span class="tab-icon">🦋</span>Plans</a>
  <a href="/app/settings"><span class="tab-icon">⚙️</span>Settings</a>
</nav>

<script src="/outnow-ui.js"></script>
<script>
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const feedEl = document.getElementById('feed');
  const statusEl = document.getElementById('status');
  const ICON = { nearby: '📍', reconnect: '💛', new: '🌱', wish: '✨', friend_out: '🌴', around: '📍', go_out: '🌴', share: '💬', public_plan: '🎉' };
  const FROM = { nearby: 'Happening near you', new: 'Something new', reconnect: 'For you', wish: 'One of your wishes' };
  let seen = [];
  let loading = false, finished = false, imagining = false;
  const stories = [];

  // Right now → a story bubble; tapping opens it in a sheet.
  function storyLabel(i) {
    if (i.type === 'friend_out') return i.title.split(' ')[0];
    if (i.type === 'share') return i.title.split(':')[0];
    if (i.type === 'around') return 'Out now';
    if (i.type === 'go_out') return 'I’m out';
    return i.title;
  }
  function addStory(i) {
    stories.push(i);
    const el = document.getElementById('stories');
    el.hidden = false;
    el.insertAdjacentHTML('beforeend', `<button class="story" onclick="openStory(${stories.length - 1})"><div class="ring"><div class="face">${ICON[i.type] || '✨'}</div></div><div class="name">${esc(storyLabel(i))}</div></button>`);
  }
  function openStory(n) {
    const i = stories[n];
    const link = i.type === 'public_plan' ? i.url : '/app/dashboard#feeling';
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
    bg.innerHTML = `<div class="sheet"><div class="who" style="font-size:17px">${ICON[i.type] || '✨'} ${esc(i.title)}</div>${i.sub ? `<div class="sub">${esc(i.sub)}</div>` : ''}
      ${(i.chips || []).length ? `<div class="row">${i.chips.map((c) => `<span class="chip static">${esc(c)}</span>`).join('')}</div>` : ''}
      <div class="row"><a class="chip" style="background:#6c47ff;border-color:#6c47ff;color:#fff" href="${esc(link)}">${i.type === 'go_out' ? 'I’m out ›' : i.type === 'public_plan' ? 'See the plan ›' : 'Open ›'}</a><button class="chip" onclick="this.closest('.sheet-bg').remove()">Close</button></div></div>`;
    document.body.appendChild(bg);
  }

  function picHtml(i) {
    const tile = `<div class="tile g-${esc(i.kind || 'new')}"><div class="big">${ICON[i.kind] || '✨'}</div><div class="t">${esc(i.title)}</div></div>`;
    if (!i.image) return `<div class="pic">${tile}</div>`;
    // The site's own picture; if it won't load, the colored tile instead.
    return `<div class="pic"><img src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=this.parentNode.dataset.tile"></div>`.replace('<div class="pic">', `<div class="pic" data-tile="${esc(tile)}">`);
  }
  function cardHtml(i) {
    const liked = i.liked_by ? (i.liked_by > 1 ? `🔁 ${i.liked_by} people around you like this` : '🔁 Someone around you likes this') : i.passed_on ? '🔁 People around you like this' : '';
    const from = i.around ? 'Found around you' : FROM[i.kind] || 'For you';
    const why = i.why && !/^(People around you like this|Found around you)$/.test(i.why) ? i.why : '';
    const when = i.date ? new Date(i.date + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) : '';
    // Where it came from (🐛 #41): ideas about things nearby come from a web search; the link only shows once it opened securely.
    const src = i.source_site ? (i.link ? `Found in a web search · ${esc(i.source_site)}` : `Found in a web search · ${esc(i.source_site)} (link hidden — it didn’t open securely)`)
      : i.kind === 'nearby' || i.kind === 'new' ? 'Imagined by ButterflAI — no web page to check' : 'Imagined by ButterflAI from your plans and chats';
    return `<article class="post" data-id="${esc(i.id)}">
      <div class="post-head"><div class="avatar">${ICON[i.kind] || '✨'}</div><div class="who">ButterflAI<small>${esc(from)}</small></div>
        <button class="x" title="Not for me" aria-label="Not for me" onclick="answer('${esc(i.id)}','dismiss',this)">✕</button></div>
      ${picHtml(i)}
      <div class="actions"><button class="act" onclick="answer('${esc(i.id)}','wish',this)">✨ Sounds fun</button><button class="act" onclick="answer('${esc(i.id)}','plan',this)">Make it a plan</button><button class="act" aria-label="Say what you think of this one" title="Say what you think of this one" onclick="this.closest('.post').classList.toggle('commenting'); const f = this.closest('.post').querySelector('.comment input'); if (f) f.focus();">💬</button>
        ${i.link ? `<a class="act link" href="/app/view?id=${encodeURIComponent(i.id)}">More ›</a>` : ''}</div>
      ${liked ? `<div class="liked">${liked}</div>` : ''}
      <div class="caption"><b>${esc(i.title)}</b>${why ? ` <span>${esc(why)}</span>` : ''}</div>
      ${when || i.place ? `<div class="facts">${when ? `<span>📅 ${esc(when)}</span>` : ''}${i.place ? `<span>📍 ${esc(i.place)}</span>` : ''}</div>` : ''}
      <div class="src">${src}</div>
      <form class="comment" onsubmit="event.preventDefault(); commentOn('${esc(i.id)}', this);"><input maxlength="500" placeholder="What do you think of this one?"><button type="submit">Save</button></form>
    </article>`;
  }

  async function loadMore() {
    if (loading || finished) return;
    loading = true;
    try {
      const r = await fetch('/api/ideas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ seen }) });
      if (r.status === 401) { location.href = '/app/login?next=/app/explore'; return; }
      const d = await r.json();
      for (const i of d.items || []) {
        seen.push(i.id);
        if (i.type === 'idea') { rendered.push(i); feedEl.insertAdjacentHTML('beforeend', cardHtml(i)); }
        else if (!['friend_out', 'around', 'go_out'].includes(i.type)) addStory(i);   // those are in the Out and about panel
      }
      if (d.done) {
        // Out of ideas: ButterflAI imagines a new batch (with a search of what's on near you).
        if (d.can_imagine_more && !imagining) {
          imagining = true;
          statusEl.textContent = '✨ Imagining more for you…';
          const m = await fetch('/api/spells/more', { method: 'POST' }).then((x) => x.json()).catch(() => ({}));
          imagining = false;
          loading = false;
          if (m.made) return loadMore();
        }
        finished = true;
        statusEl.textContent = seen.length ? 'That’s everything for now — more as people around you add theirs, and new ideas tomorrow.' : 'Nothing yet — ideas show up here as ButterflAI finds them.';
      } else statusEl.textContent = '';
    } catch (_) { statusEl.textContent = 'Couldn’t load — pull to try again.'; }
    loading = false;
    remember();
    if (!finished && (d_visible())) loadMore();
  }

  // ── Back where you were (🐛 #48): what was shown and how far down, for 30 minutes ──
  const rendered = [];
  let restoring = false;
  function remember() {
    if (restoring) return;
    // The post at the top of the screen and how far down it sits — things above it can still be loading.
    const top = [...document.querySelectorAll('.post')].find((p) => p.getBoundingClientRect().bottom > 60);
    try { sessionStorage.setItem('bfly-explore', JSON.stringify({ at: Date.now(), seen, rendered: rendered.filter((i) => document.querySelector(`.post[data-id="${CSS.escape(i.id)}"]`)), stories, finished, y: scrollY,
      anchor: top ? { id: top.dataset.id, top: top.getBoundingClientRect().top } : null })); } catch (_) {}
  }
  function restore() {
    let s = null;
    try { s = JSON.parse(sessionStorage.getItem('bfly-explore') || localStorage.getItem('bfly-explore') || 'null'); } catch (_) {}
    if (!s || Date.now() - s.at > 30 * 60 * 1000 || !(s.rendered || []).length) return false;
    restoring = true;
    seen = s.seen || []; finished = !!s.finished;
    for (const i of s.stories || []) addStory(i);
    for (const i of s.rendered) { rendered.push(i); feedEl.insertAdjacentHTML('beforeend', cardHtml(i)); }
    // Back to that post (again as the Out and about panel and stories finish loading above it), unless you've scrolled.
    let moved = false;
    const mark = () => { moved = true; };
    addEventListener('touchmove', mark, { once: true, passive: true }); addEventListener('wheel', mark, { once: true, passive: true });
    const place = () => {
      if (moved) return;
      const el = s.anchor && document.querySelector(`.post[data-id="${CSS.escape(s.anchor.id)}"]`);
      scrollTo(0, el ? el.getBoundingClientRect().top + scrollY - s.anchor.top : s.y || 0);
    };
    requestAnimationFrame(place);
    setTimeout(place, 400); setTimeout(() => { place(); restoring = false; }, 1200);
    return true;
  }
  let saveTimer = null;
  addEventListener('scroll', () => { clearTimeout(saveTimer); saveTimer = setTimeout(remember, 250); }, { passive: true });
  addEventListener('pagehide', () => { remember(); try { localStorage.setItem('bfly-explore', sessionStorage.getItem('bfly-explore')); } catch (_) {} });

  // ── 💬 on one post (🐛 #49): what you think of THIS suggestion — saved on it, shapes your ideas ──
  async function commentOn(id, form) {
    const input = form.querySelector('input'); const note = input.value.trim(); if (!note) return;
    const r = await fetch('/api/spells/' + encodeURIComponent(id) + '/react', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ note }) }).then((x) => x.json()).catch(() => ({}));
    input.value = '';
    input.placeholder = r.error ? 'Couldn’t save — try again' : '✓ Saved — this shapes your ideas';
  }

  // ── 🔎 Ask Explore (🐛 #50): a search, or steering ("more outdoors") that sticks ──
  async function askExplore() {
    const el = document.getElementById('ask-text'); const text = el.value.trim(); if (!text) return;
    const box = document.getElementById('asked');
    box.innerHTML = `<div class="asked-head">🔎 Looking for “${esc(text)}”…</div>`;
    el.blur();
    scrollTo({ top: 0, behavior: 'smooth' });   // the answer shows at the top — asked from anywhere down the feed
    const r = await fetch('/api/ideas/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) }).then((x) => x.json()).catch(() => ({}));
    el.value = '';
    const items = r.items || [];
    for (const i of items) { seen.push(i.id); rendered.push(i); }
    box.innerHTML = `<div class="asked-head">🔎 For “${esc(text)}”${items.length ? '' : ' — ' + esc(r.message || 'nothing found right now')}<button aria-label="Clear" onclick="document.getElementById('asked').innerHTML=''">✕</button></div>`
      + items.map((i) => cardHtml({ type: 'idea', ...i })).join('')
      + (items.length ? '<div class="sub" style="margin:0 2px 14px">ButterflAI will keep this in mind for your ideas from now on.</div>' : '');
  }
  function d_visible() { const r = document.getElementById('sentinel').getBoundingClientRect(); return r.top < innerHeight + 400; }

  async function answer(id, ans, btn) {
    const card = btn.closest('.post');
    // Make it a plan: the idea opens in ＋ New plan to change before anything's made (🐛 #47); the idea rides along (#45).
    if (ans === 'plan' && window.bflyNewPlan) {
      const it = rendered.find((x) => x.id === id) || {};
      window.bflyNewPlan(String(it.title || '').replace(/\?$/, ''), { spell: id, about: it.title });
      return;
    }
    btn.disabled = true;
    const r = await fetch('/api/spells/' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answer: ans }) }).then((x) => x.json()).catch(() => ({}));
    if (ans === 'dismiss') { card.remove(); remember(); return; }
    if (ans === 'wish') {
      btn.classList.add('on');
      btn.textContent = r.passed_on ? '✨ Kept · passed on' : '✨ Kept as a wish';
    }
  }

  // (More opens the page inside ButterflAI with a comment bar — /app/view; it replaced the "back from a page" sheet.)
  // ── Map (🐛 #43): pins colored by how soon — green today → purple two weeks or more; grey with no date ──
  let mapObj = null, mapLoaded = false;
  function colorFor(date, today) {
    if (!date) return '#8e8e93';
    const days = Math.max(0, Math.round((Date.parse(date) - Date.parse(today)) / 86400000));
    const t = Math.min(1, days / 14);
    const a = [0x34, 0xc7, 0x59], b = [0x6c, 0x47, 0xff];
    return '#' + a.map((x, k) => Math.round(x + (b[k] - x) * t).toString(16).padStart(2, '0')).join('');
  }
  function loadLeaflet() {
    return window.L ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  }
  async function showView(v) {
    document.getElementById('v-list').classList.toggle('on', v === 'list');
    document.getElementById('v-map').classList.toggle('on', v === 'map');
    document.getElementById('list-view').hidden = v !== 'list';
    document.getElementById('map-wrap').hidden = v !== 'map';
    try { localStorage.setItem('bfly-explore-view', v); } catch (_) {}
    if (v !== 'map') return;
    try { await loadLeaflet(); } catch (_) { document.getElementById('map').innerHTML = '<div class="status">The map couldn’t load.</div>'; return; }
    if (!mapObj) {
      mapObj = L.map('map', { zoomControl: false }).setView([39.5, -119.8], 11);
      // A plain street map — roads and neighborhoods, like the classic Google view (🐛 #46), not terrain.
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '© OpenStreetMap © CARTO' }).addTo(mapObj);
    }
    setTimeout(() => mapObj.invalidateSize(), 50);
    if (mapLoaded) return;
    mapLoaded = true;
    const d = await fetch('/api/ideas/map').then((r) => r.json()).catch(() => ({ pins: [] }));
    const pts = [];
    for (const p of d.pins || []) {
      const c = colorFor(p.date, d.today);
      const when = p.date ? new Date(p.date + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) : 'No date';
      L.circleMarker([p.lat, p.lng], { radius: 10, color: '#fff', weight: 2, fillColor: c, fillOpacity: 1 }).addTo(mapObj)
        .bindPopup(`<b>${esc(p.title)}</b><br>${esc(when)}${p.place ? ' · ' + esc(p.place) : ''}${p.link ? `<br><a href="/app/view?id=${encodeURIComponent(p.id)}">More ›</a>` : ''}`);
      pts.push([p.lat, p.lng]);
    }
    if (d.me) { L.circleMarker([d.me.lat, d.me.lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#1c1c1e', fillOpacity: 1 }).addTo(mapObj).bindPopup('You'); pts.push([d.me.lat, d.me.lng]); }
    if (pts.length) mapObj.fitBounds(pts, { padding: [40, 40], maxZoom: 14 });
    // How many ideas aren't on the map (no place found yet) — so an empty map isn't a mystery (🐛 #46).
    const off = d.unplaced || 0;
    if (off) {
      const note = L.control({ position: 'topright' });
      note.onAdd = () => { const el = L.DomUtil.create('div', 'legend'); el.style.position = 'static'; el.textContent = `${off} idea${off === 1 ? '' : 's'} without a place aren’t shown`; return el; };
      note.addTo(mapObj);
    }
    if (!(d.pins || []).length) L.popup().setLatLng(mapObj.getCenter()).setContent('Nothing on the map yet — ideas at a real place show up here.').openOn(mapObj);
  }
  try { if (localStorage.getItem('bfly-explore-view') === 'map') showView('map'); } catch (_) {}

  new IntersectionObserver((e) => { if (e.some((x) => x.isIntersecting)) loadMore(); }, { rootMargin: '400px' }).observe(document.getElementById('sentinel'));
  // Coming back keeps your place (🐛 #48 — it used to start over after 10 minutes, or on every visit).
  loadOut(true);   // 🌴 Out and about (and refresh where you are if you're out)
  // A 🐛 report says which posts were on screen — the one in the middle first (🐛 #49).
  window.bflyFeedbackState = () => {
    const mid = innerHeight / 2;
    const onScreen = [...document.querySelectorAll('.post')].map((p) => ({ p, r: p.getBoundingClientRect() })).filter(({ r }) => r.bottom > 0 && r.top < innerHeight)
      .sort((a, b) => Math.abs((a.r.top + a.r.bottom) / 2 - mid) - Math.abs((b.r.top + b.r.bottom) / 2 - mid))
      .map(({ p }) => ({ id: p.dataset.id, title: (rendered.find((x) => x.id === p.dataset.id) || {}).title }));
    return { screen: 'explore', looking_at: onScreen[0] || null, on_screen: onScreen, shown: seen.slice(0, 60) };
  };
  if (!restore()) loadMore();
</script>
