<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ButterflAI">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <meta name="theme-color" content="#6c47ff">
  <title>ButterflAI — Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦋</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --purple: #6c47ff; --bg: #f2f2f7; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      padding: 0 20px;
      height: 56px;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 22px; font-weight: 700; color: #1a1a1a; text-decoration: none; }
    nav { margin-left: auto; display: flex; gap: 20px; }
    nav a { font-size: 14px; color: var(--purple); text-decoration: none; font-weight: 500; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    /* ── Mobile nav ─────────────────────────────────────────────────────────── */
    .bottom-nav { display: none; }
    @media (max-width: 640px) {
      nav { display: none; }
      .logo { font-size: 18px; }
      main { padding-bottom: 80px; }
      .bottom-nav {
        display: flex; position: fixed; bottom: 0; left: 0; right: 0;
        height: 58px; background: #fff; border-top: 1px solid #e5e5e5;
        z-index: 100; justify-content: space-around; align-items: center;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .bottom-nav a {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        font-size: 10px; font-weight: 500; color: #888; text-decoration: none;
        min-width: 52px; padding: 6px 2px; border-radius: 8px;
      }
      .bottom-nav a.active { color: #6c47ff; }
      .bottom-nav .tab-icon { font-size: 22px; line-height: 1; }
    }
    .banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .banner p { font-size: 14px; color: #92400e; }
    .banner a {
      font-size: 13px;
      color: #92400e;
      font-weight: 600;
      text-decoration: underline;
      white-space: nowrap;
    }
    section { margin-bottom: 32px; }
    h2 { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      margin-bottom: 10px;
    }
    .card-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .card-sub { font-size: 13px; color: #888; }
    .empty-state { font-size: 14px; color: #aaa; text-align: center; padding: 24px 0; }
    .share-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip-btn { background: #fff; border: 1.5px solid #e5e5e5; border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
    .chip-btn:hover { border-color: var(--purple); }
    .share-other { display: flex; gap: 8px; }
    .share-other input { flex: 1; border: 1.5px solid #e5e5e5; border-radius: 12px; padding: 10px 12px; font-size: 14px; min-width: 0; }
    .share-other button { background: var(--purple); color: #fff; border: none; border-radius: 12px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .mine { display: flex; align-items: center; gap: 8px; background: #ede9fe; border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 14px; }
    .mine span { flex: 1; }
    .mine button { background: none; border: none; color: #8e8e93; font-size: 16px; cursor: pointer; }
    .feed-item { display: flex; gap: 12px; align-items: flex-start; text-decoration: none; color: inherit; }
    .feed-icon { font-size: 20px; line-height: 1.3; }
    .feed-item .card-sub { margin-top: 2px; }
    .badge-tentative { display: inline-block; font-size: 11px; font-weight: 600; color: #b45309; background: #fef3c7; border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
    .feed-action { margin-top: 4px; font-size: 13px; font-weight: 600; color: #6c47ff; }
    .feed-item.needs-you { border: 2px solid #6c47ff; }
    .hint { font-size: 13px; color: #888; margin-top: 8px; line-height: 1.5; }
    /* Home at a glance (owner, 2026-10-13): three compact sections, each with a one-line
       summary beside the title and one preview item; › opens the full section. */
    section.home-sec { margin-bottom: 18px; }
    .sec-head { display: flex; align-items: baseline; gap: 10px; width: 100%; background: none; border: none; padding: 0 0 8px;
      font-family: inherit; text-align: left; cursor: pointer; color: inherit; }
    .sec-head h2 { margin: 0; flex-shrink: 0; }
    .sec-line { flex: 1; min-width: 0; font-size: 13px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sec-line.needs { color: #6c47ff; font-weight: 600; }
    .sec-more { font-size: 20px; color: #6c47ff; line-height: 1; flex-shrink: 0; }
    .home-sec .empty-state { padding: 10px 0; text-align: left; }
    /* Full-screen section (#feeling, #creating, #happenings — back closes it). */
    #sec-full { position: fixed; inset: 0; z-index: 200; background: #f2f2f7; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    #sec-full[hidden] { display: none; }
    .full-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; background: #fff;
      border-bottom: 1px solid #e5e5e5; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
    .full-head h2 { margin: 0; flex: 1; }
    .full-back { background: none; border: none; color: #6c47ff; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; padding: 6px 8px; }
    .full-body { max-width: 720px; margin: 0 auto; padding: 16px; }
    .full-body h3 { font-size: 13px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }
    body.full-open { overflow: hidden; }
  </style>
</head>
<body>
<header>
  <a class="logo" href="/app/dashboard">🦋 ButterflAI</a>
  <nav>
    <a href="/app/chat">ButterflAI</a>
    <a href="/app/contacts">Contacts</a>
    <a href="/app/events">Events</a>
    <a href="/app/settings">Settings</a>
  </nav>
</header>

<main>
  <!-- Install app prompt slot (populated by install-prompt.js) -->
  <div id="install-prompt-slot"></div>


  <!-- Home = Feeling · Creating · Happenings (owner, 2026-10-12). All three visible at a
       glance (2026-10-13): summary beside each title, one preview item, › opens it full screen. -->
  <!-- Feeling: ✨ wishes first — things you'd love to happen; the agents look for people who wish
       for the same (owner, 2026-10-20: "cast a spell into the world … to bring the world together").
       Then the quick shares (what you're up for — friends see it in Happenings; nobody is pinged). -->
  <section class="home-sec" id="sec-feeling">
    <button type="button" class="sec-head" onclick="openSection('feeling')" aria-label="Open Feeling"><h2>Feeling</h2><span class="sec-line" id="line-feeling"></span><span class="sec-more">›</span></button>
    <!-- ✨ What ButterflAI imagines for you (spells.js, 🐛 #36), then your wish box and shared wishes.
         The quick "Free tonight" shares live in the full Feeling view. -->
    <div id="out-now"></div>
    <div id="spell-preview"></div>
    <div id="wish-preview"></div>
    <form class="share-other wish-form" onsubmit="event.preventDefault(); addWish(this);">
      <input name="wish" placeholder="✨ I wish… e.g. hot springs with friends this fall" maxlength="200" aria-label="Make a wish">
      <button type="submit">Wish</button></form>
    <div id="my-plans"></div>
  </section>

  <!-- Creating: what you're helping make happen with friends (each plan's shared list) -->
  <section class="home-sec" id="sec-creating">
    <button type="button" class="sec-head" onclick="location.href='/app/creating'" aria-label="Open Creating"><h2>Creating</h2><span class="sec-line" id="line-creating"></span><span class="sec-more">›</span></button>
    <div id="creating"><div class="empty-state">Loading…</div></div>
  </section>

  <!-- Happenings: ranked by what matters soonest -->
  <section class="home-sec" id="sec-happenings">
    <button type="button" class="sec-head" onclick="openSection('happenings')" aria-label="Open Happenings"><h2>Happenings</h2><span class="sec-line" id="line-happenings"></span><span class="sec-more">›</span></button>
    <div id="feed"><div class="empty-state">Loading…</div></div>
  </section>
</main>

<!-- One section, full screen -->
<div id="sec-full" hidden role="dialog" aria-modal="true">
  <div class="full-head"><button type="button" class="full-back" onclick="closeSection()">‹ Home</button><h2 id="full-title"></h2></div>
  <div class="full-body" id="full-body"></div>
</div>

<!-- Home · Plans · Settings (owner, 2026-10-20: the tabs were redundant with the pills and the
     switcher — Chat, Creating and Events are one place, Plans; People is in Settings). -->
<nav class="bottom-nav">
  <a href="/app/dashboard" class="active"><span class="tab-icon">🏠</span>Home</a>
  <a href="/app/explore"><span class="tab-icon">🧭</span>Explore</a>
  <a href="/app/chat" onclick="try{var u=localStorage.getItem('bfly-plans-last');if(u&&u.indexOf('/app/')===0){location.href=u;return false}}catch(e){}"><span class="tab-icon">🦋</span>Plans</a>
  <a href="/app/settings"><span class="tab-icon">⚙️</span>Settings</a>
</nav>

<script src="/outnow-ui.js"></script>
<script>
  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  // "Today 7:00 PM" / "Tomorrow 7:00 PM" / "Sat 7:00 PM" / "Oct 20, 7:00 PM"
  function when(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000), now = new Date();
    const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((startOf(d) - startOf(now)) / 86400000);
    if (days === 0) return `Today ${t}`;
    if (days === 1) return `Tomorrow ${t}`;
    if (days > 1 && days < 7) return `${d.toLocaleDateString([], { weekday: 'short' })} ${t}`;
    return `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}, ${t}`;
  }

  // Tentative trips show the date only (times are placeholders until it's settled).
  function whenFor(i) {
    // Proposed dates (tentative options): "Oct 23–25 or Nov 6–8 (proposed)".
    if (i.proposed_dates && i.proposed_dates.length) {
      const d = (s) => new Date(s + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });
      return i.proposed_dates.map(p => p.from === p.to ? d(p.from) : `${d(p.from)}–${d(p.to)}`).join(' or ') + ' (proposed)';
    }
    if (i.date_tbd) return 'Date TBD';
    if (!i.tentative) return when(i.at);
    const d = new Date(i.at * 1000);
    return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  }
  const names = (a) => a.length <= 2 ? a.join(' & ') : a.slice(0, -1).join(', ') + ' & ' + a[a.length - 1];
  const tent = (i) => i.tentative ? '<span class="badge-tentative">Tentative</span>' : '';
  const action = (i) => i.action ? `<div class="feed-action">${esc(i.action)}</div>` : '';

  function feedItemHtml(i) {
    if (i.type === 'invite') return `<a class="card feed-item needs-you" href="/app/events?event=${esc(i.event_id)}"><span class="feed-icon">📩</span><div><div class="card-title">${esc(i.host)} ${i.tentative ? 'is planning' : 'invited you'}: ${esc(i.title)}${tent(i)}</div><div class="card-sub">${whenFor(i)}${i.venue ? ' · ' + esc(i.venue) : ''}</div>${action(i)}</div></a>`;
    if (i.type === 'event') {
      const who = i.role === 'host'
        ? [(i.going || []).length ? `${names(i.going.map(esc))} going` : '',
           (i.interested || []).filter((x) => !(i.going || []).includes(x)).length ? `${names(i.interested.filter((x) => !(i.going || []).includes(x)).map(esc))} interested` : '',
           i.waiting_on && i.waiting_on.length ? `waiting on ${names(i.waiting_on.map(esc))}` : '',
           i.asked && i.asked.length ? `asked ${names(i.asked.map(esc))}, no answer yet` : '',
           i.out && i.out.length ? `${names(i.out.map(esc))} out` : '',
           ...(i.deferring || []).map((d) => `${esc(d.who)}: whatever ${names(d.to.map(esc))} decide${d.to.length === 1 && d.to[0] !== 'you' ? 's' : ''}`)].filter(Boolean).join(' · ') || 'you\'re hosting'
        : 'with ' + esc(i.host);
      // The card opens the plan's summary — dates, people, suggestions, Creating, what needs
      // doing, and a button into its discussion (🐛 #26, 2026-10-20: the chat opened at the
      // latest message and "I have to go and find the relevant information"). Was the chat.
      const href = `/app/events?event=${esc(i.event_id)}`;
      return `<a class="card feed-item${i.action ? ' needs-you' : ''}" href="${href}"><span class="feed-icon">${i.tentative ? '🗓️' : '📅'}</span><div><div class="card-title">${esc(i.title)}${tent(i)}</div><div class="card-sub">${whenFor(i)}${i.venue ? ' · ' + esc(i.venue) : ''} · ${who}</div>${action(i)}</div></a>`;
    }
    // "Did you make it?" after a plan (2026-10-13): answered right here.
    if (i.type === 'checkin') return `<div class="card feed-item needs-you"><span class="feed-icon">🦋</span><div style="flex:1;min-width:0">
      <div class="card-title">Did you make it to ${esc(i.title)}?</div><div class="card-sub">${when(i.at)}</div>
      <div class="share-row" style="margin:8px 0 0"><button class="chip-btn" onclick="answerCheckin('${esc(i.confirmation_id)}', true)">Yes</button>
      <button class="chip-btn" onclick="answerCheckin('${esc(i.confirmation_id)}', false)">No</button>
      <button class="chip-btn" onclick="answerCheckin('${esc(i.confirmation_id)}', null)">Skip</button></div></div></div>`;
    // A question opens the chat with the question pinned on top (🐛 #26).
    const chatLink = (i) => (i.event_id ? `/app/chat?event=${esc(i.event_id)}&ask=${esc(i.question_id)}` : `/app/chat?ask=${esc(i.question_id)}`);
    if (i.type === 'question') return `<a class="card feed-item needs-you" href="${chatLink(i)}"><span class="feed-icon">❓</span><div><div class="card-title">${esc(i.who)} asked</div><div class="card-sub">${esc(i.text)}</div>${action(i)}</div></a>`;
    // A friend's share can become a plan you host with them (event-map #5, 2026-10-13).
    if (i.type === 'plan') return `<div class="card feed-item"><span class="feed-icon">🟢</span><div style="flex:1;min-width:0"><div class="card-title">${esc(i.who)}: ${esc(i.text)}</div><div class="card-sub">until ${when(i.until)}</div>
      ${shareAction(i.plan_id, i.made_plan, `Make a plan with ${esc(i.who)}`)}</div></div>`;
    if (i.type === 'interest') return `<div class="card feed-item"><span class="feed-icon">👋</span><div><div class="card-title">${esc(i.who)}'s up for something ${esc(i.about)}</div><div class="card-sub">Share what you're up to above if you're in</div></div></div>`;
    return '';
  }

  // Creating (2026-10-12): what you're helping make happen — items from your plans'
  // shared lists assigned to you, soonest plan first. Check off right here.
  // Yours first, then anything unassigned (anyone can take it), then suggestions waiting
  // to be kept, per plan (2026-10-12).
  function creatingHtml(list, suggestions) {
    // Each opens the plan's chat with the thing itself highlighted in its Creating bar (🐛 #26).
    const sug = (suggestions || []).map(s => `<a class="card feed-item" href="/app/creating?event=${esc(s.event_id)}&focus=suggestions"><span class="feed-icon">💡</span><div>
      <div class="card-title">${s.count} suggestion${s.count === 1 ? '' : 's'} for ${esc(s.title)}</div><div class="card-sub">Keep the ones you want</div></div></a>`).join('');
    if ((!list || !list.length) && !sug) return '<div class="empty-state">Nothing to do right now. Open a plan\'s chat to add what needs doing.</div>';
    return (list || []).map(i => `<div class="card feed-item"><span class="feed-icon">✨</span><div style="flex:1;min-width:0">
      <a href="/app/creating?event=${esc(i.event_id)}&todo=${esc(i.todo_id)}" style="text-decoration:none;color:inherit"><div class="card-title">${esc(i.text)}</div>
      <div class="card-sub">${esc(i.title)}${i.at ? ' · ' + whenFor(i) : ''} · ${i.who === 'you' ? 'you\'re on it' : 'nobody\'s on it yet'}</div></a>
      ${i.who === 'you'
        // An action, not a status: "✓ Done" read as "it's done" (🐛 #26 — the massages weren't).
        ? `<button type="button" class="feed-action" style="background:none;border:none;padding:0;cursor:pointer;font-family:inherit" onclick="doneTodo('${esc(i.todo_id)}')">☐ Mark done</button>`
        : `<button type="button" class="feed-action" style="background:none;border:none;padding:0;cursor:pointer;font-family:inherit" onclick="joinTodo('${esc(i.todo_id)}')">I'm on it</button>`}</div></div>`).join('') + sug;
  }
  async function answerCheckin(id, attended) {
    await fetch('/api/attendance/' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ attended }) }).catch(() => {});
    loadFeed();
  }
  async function joinTodo(id) {
    await fetch('/api/todos/' + encodeURIComponent(id) + '/join', { method: 'POST' }).catch(() => {});
    loadFeed();
  }
  async function doneTodo(id) {
    await fetch('/api/todos/' + encodeURIComponent(id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ done: true }) }).catch(() => {});
    loadFeed();
  }

  // ── Home at a glance + full sections (owner, 2026-10-13) ─────────────────────
  // The summary lines come from the server (plans.homeSummary); the page only shows them.
  let feed = null;
  const SECTIONS = { feeling: 'Feeling', creating: 'Creating', happenings: 'Happenings' };
  const EMPTY_HAPPENINGS = '<div class="empty-state">Nothing yet. Share what you\'re up to, or ask your agent "what are my friends up to tonight?"</div>';
  // A share → a plan (event-map #5): "Make it a plan", or "Open plan" once it is one.
  const shareAction = (shareId, madePlan, label) => madePlan
    ? `<a class="feed-action" href="/app/events?event=${esc(madePlan)}" style="text-decoration:none">Open plan ›</a>`
    : `<button type="button" class="feed-action share-plan-btn" style="background:none;border:none;padding:0;cursor:pointer;font-family:inherit" onclick="planFromShare('${esc(shareId)}', this)">${label} ›</button>`;
  const minePlansHtml = (list) => (list || []).map(p =>
    `<div class="mine"><span>You: ${esc(p.text)} · until ${when(p.until)}<br>${shareAction(p.plan_id, p.made_plan, 'Make it a plan')}</span><button title="Remove" onclick="removePlan('${esc(p.plan_id)}')">✕</button></div>`).join('');
  // ── Wishes (wishes.js) ──
  function wishHtml(w) {
    return `<div class="card feed-item"><span class="feed-icon">✨</span><div style="flex:1;min-width:0">
      <div class="card-title">${esc(w.text)}</div>
      <div class="card-sub">${w.status === 'planned' ? 'It’s a plan now' : w.open_to_new ? 'Open to people you haven’t met' : 'Only people you know'}</div>
      ${w.status === 'planned' && w.event_id ? `<a class="feed-action" href="/app/chat?event=${esc(w.event_id)}" style="text-decoration:none">Open plan ›</a>` : `<div class="share-row" style="margin:6px 0 0">
        <label style="font-size:13px;color:#3a3a3c"><input type="checkbox" ${w.open_to_new ? '' : 'checked'} onchange="toggleWishOpen('${esc(w.id)}', !this.checked)"> Only people I know</label></div>`}
      </div><button title="Remove" style="background:none;border:none;color:#c7c7cc;font-size:16px;cursor:pointer" onclick="removeWish('${esc(w.id)}')">✕</button></div>`;
  }
  // ── 🌴 I'm out: the shared Out and about panel (public/outnow-ui.js — the same on Home and Explore, 🐛 #40) ──

  // A spell: an idea ButterflAI imagined for you — ✨ Sounds fun (becomes your wish), Make it a plan, ✕.
  const SPELL_ICON = { nearby: '📍', reconnect: '💛', new: '🌱', wish: '✨' };
  function spellHtml(s) {
    return `<div class="card feed-item"><span class="feed-icon">${SPELL_ICON[s.kind] || '✨'}</span><div style="flex:1;min-width:0">
      <div class="card-title">${esc(s.title)}</div>${s.why && s.why !== 'People around you like this' ? `<div class="card-sub">${esc(s.why)}</div>` : ''}${s.passed_on ? `<div class="card-sub">🔁 ${s.liked_by > 1 ? `${s.liked_by} people around you like this` : 'People around you like this'}</div>` : ''}
      ${s.link ? `<a class="card-sub" href="${esc(s.link)}" target="_blank" rel="noopener" style="color:#6c47ff">More ›</a>` : ''}
      <div class="share-row" style="margin:6px 0 0"><button class="chip-btn" onclick="answerSpell('${esc(s.id)}','wish',this)">✨ Sounds fun</button><button class="chip-btn" onclick="answerSpell('${esc(s.id)}','plan',this)">Make it a plan</button></div>
      </div><button title="Not for me" aria-label="Not for me" style="background:none;border:none;color:#c7c7cc;font-size:16px;cursor:pointer;align-self:flex-start" onclick="answerSpell('${esc(s.id)}','dismiss',this)">✕</button></div>`;
  }
  async function answerSpell(id, answer, btn) {
    if (btn) btn.disabled = true;
    const r = await fetch('/api/spells/' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answer }) }).then((x) => x.json()).catch(() => ({}));
    if (answer === 'wish' && r.passed_on) showToast('✨ Kept as a wish — and passed on to people around you, without your name');
    if (answer === 'plan' && r.text) {   // straight into ＋ New plan, already filled in
      const p = await fetch('/api/plans/new', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: r.text }) }).then((x) => x.json()).catch(() => null);
      if (p && p.ts) { location.href = '/app/chat?new=' + encodeURIComponent(p.ts); return; }
    }
    loadFeed();
  }
  function showToast(text) {
    const t = document.createElement('div');
    t.textContent = text;
    t.style.cssText = 'position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;background:#1c1c1e;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.2)';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }
  async function moreSpells(btn) {
    btn.disabled = true; btn.textContent = '✨ Imagining…';
    const r = await fetch('/api/spells/more', { method: 'POST' }).then((x) => x.json()).catch(() => ({}));
    if (r.error) { btn.textContent = r.message || 'Try again later'; return; }
    await loadFeed();
  }
  function matchHtml(m) {
    const who = m.who ? esc(m.who) : 'Someone near you';
    const body = m.status === 'planned' || m.status === 'connected'
      ? (m.event_id ? `<a class="feed-action" href="/app/chat?event=${esc(m.event_id)}" style="text-decoration:none">Open the plan ›</a>` : '')
      : m.waiting_on_them ? '<div class="card-sub">You’re open to it — waiting on them (they won’t know who you are unless they are too)</div>'
      : m.kind === 'friend'
        ? `<div class="share-row" style="margin:6px 0 0"><button class="chip-btn" onclick="answerMatch('${esc(m.id)}','plan',this)">Make it a plan</button><button class="chip-btn" onclick="answerMatch('${esc(m.id)}','no',this)">Not now</button></div>`
        : `<div class="share-row" style="margin:6px 0 0"><button class="chip-btn" onclick="answerMatch('${esc(m.id)}','open',this)">Open to meeting</button><button class="chip-btn" onclick="answerMatch('${esc(m.id)}','no',this)">Not now</button></div>`;
    return `<div class="card feed-item needs-you"><span class="feed-icon">🪄</span><div style="flex:1;min-width:0">
      <div class="card-title">${who} wishes for this too</div><div class="card-sub">${esc(m.together)}</div>${body}</div></div>`;
  }
  async function addWish(form) {
    const input = form.querySelector('input'); const text = input.value.trim(); if (!text) return;
    input.value = '';
    await fetch('/api/wishes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) }).catch(() => {});
    loadFeed();
  }
  async function toggleWishOpen(id, open) {
    await fetch('/api/wishes/' + encodeURIComponent(id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ open_to_new: open }) }).catch(() => {});
    loadFeed();
  }
  async function removeWish(id) {
    await fetch('/api/wishes/' + encodeURIComponent(id), { method: 'DELETE' }).catch(() => {});
    loadFeed();
  }
  async function answerMatch(id, answer, btn) {
    if (btn) btn.disabled = true;
    const r = await fetch('/api/wish-matches/' + encodeURIComponent(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answer }) }).then((x) => x.json()).catch(() => ({}));
    if (r.event_id && answer !== 'no') { location.href = '/app/chat?event=' + encodeURIComponent(r.event_id); return; }
    loadFeed();
  }
  async function planFromShare(shareId, btn) {
    if (btn) { btn.disabled = true; btn.textContent = 'Making the plan…'; }
    try {
      const r = await fetch('/api/shares/' + encodeURIComponent(shareId) + '/plan', { method: 'POST' });
      const j = await r.json();
      if (r.ok && j.eventId) { location.href = '/app/events?event=' + encodeURIComponent(j.eventId); return; }
      if (btn) btn.textContent = j.message || 'Couldn’t make it a plan';
    } catch (_) { if (btn) btn.textContent = 'Couldn’t make it a plan — try again'; }
  }
  const friendsFeeling = (items) => (items || []).filter(i => i.type === 'plan' || i.type === 'interest');

  function homeHappenings(items) {
    const soon = Date.now() / 1000 + 14 * 86400;
    const picked = items.filter((i) => i.action || ((i.type === 'event' || i.type === 'invite') && (i.sort_at || i.at || 0) <= soon && (i.sort_at || i.at)));
    return (picked.length ? picked : items).slice(0, 4);
  }
  function renderHome() {
    const { items, my_plans, creating, creating_suggestions, summary } = feed;
    for (const k of Object.keys(SECTIONS)) {
      const el = document.getElementById('line-' + k), sm = (summary || {})[k] || {};
      el.textContent = sm.line || ''; el.classList.toggle('needs', !!sm.needs_you);
    }
    // One preview each: a shared wish waiting for you (or your newest wish), your active share;
    // your next to-do (or a suggestion); the top happening.
    const w = feed.wishes || { mine: [], matches: [] };
    const waitingMatch = w.matches.find((m) => !m.my_answer && m.status === 'open');
    document.getElementById('wish-preview').innerHTML = waitingMatch ? matchHtml(waitingMatch) : '';
    // Ideas live in their own tab now, 🧭 Explore (owner, 2026-10-20) — Home points there.
    const nIdeas = (feed.spells || []).length;
    document.getElementById('spell-preview').innerHTML = `<a class="card feed-item" href="/app/explore" style="text-decoration:none;color:inherit"><span class="feed-icon">✨</span><div style="flex:1;min-width:0">
      <div class="card-title">${nIdeas ? `${nIdeas} idea${nIdeas === 1 ? '' : 's'} for you in Explore` : 'Ideas around you'}</div><div class="card-sub">What ButterflAI found nearby and what people around you like ›</div></div></a>`;
    document.getElementById('my-plans').innerHTML = minePlansHtml((my_plans || []).slice(0, 1));
    document.getElementById('creating').innerHTML = (creating || []).length ? creatingHtml(creating.slice(0, 1), [])
      : (creating_suggestions || []).length ? creatingHtml([], creating_suggestions.slice(0, 1)) : creatingHtml([], []);
    // Happenings on Home: everything that needs you, then your plans in the next two weeks
    // (up to 4). One item hid Melanie's Birthday Weekend behind Liam's party — "all the
    // events for the weekend were deleted" (2026-10-13). The rest is one tap away (›).
    document.getElementById('feed').innerHTML = items && items.length ? homeHappenings(items).map(feedItemHtml).join('') : EMPTY_HAPPENINGS;
  }

  // Creating in full: grouped by plan (yours first within each, then open, then suggestions).
  function creatingFullHtml(list, suggestions) {
    if (!(list || []).length && !(suggestions || []).length) return creatingHtml([], []);
    const groups = new Map();
    for (const i of list || []) { if (!groups.has(i.event_id)) groups.set(i.event_id, { title: i.title, items: [] }); groups.get(i.event_id).items.push(i); }
    return [...groups.values()].map(g => `<h3>${esc(g.title)}</h3>` + creatingHtml(g.items, [])).join('')
      + ((suggestions || []).length ? '<h3>Suggestions to keep</h3>' + creatingHtml([], suggestions) : '');
  }

  function renderFull(k) {
    const { items, my_plans, creating, creating_suggestions, summary } = feed;
    const line = (summary || {})[k]?.line ? `<p class="hint" style="margin:0 0 6px">${esc(summary[k].line)}</p>` : '';
    let body = '';
    if (k === 'feeling') {
      const friends = friendsFeeling(items);
      const w = feed.wishes || { mine: [], matches: [] };
      body = `<a class="card feed-item" href="/app/explore" style="text-decoration:none;color:inherit"><span class="feed-icon">✨</span><div style="flex:1;min-width:0"><div class="card-title">Ideas are in 🧭 Explore</div><div class="card-sub">What ButterflAI found nearby and what people around you like ›</div></div></a>
        <h3>✨ Wishes</h3>
        <form class="share-other wish-form" onsubmit="event.preventDefault(); addWish(this);">
          <input name="wish" placeholder="I wish… e.g. learn to salsa, see live music, a cabin weekend" maxlength="200" aria-label="Make a wish">
          <button type="submit">Wish</button></form>
        ${w.matches.map(matchHtml).join('')}
        ${w.mine.map(wishHtml).join('') || ''}
        <p class="hint">Your ButterflAI looks for people who wish for the same thing — your friends, and people near you you haven't met (unless you choose "Only people I know"). Nobody sees your wishes; when it's someone else's wish too, you both hear about it. People you don't know stay anonymous until you're both open to meeting.</p>
        <h3>Right now</h3>
        <div class="share-row">
          <button class="chip-btn" onclick="quickShare('Free tonight', 'tonight')">🟢 Free tonight</button>
          <button class="chip-btn" onclick="quickShare('Free this weekend', 'this weekend')">📅 Free this weekend</button>
          <button class="chip-btn" onclick="quickShare('Laying low tonight', 'tonight')">🛋️ Laying low tonight</button></div>
        <form class="share-other" onsubmit="event.preventDefault(); shareOther();">
          <input id="share-text" placeholder="Something else… e.g. At Sully's from 9 this weekend" maxlength="200">
          <button type="submit">Share</button></form>
        ${minePlansHtml(my_plans)}
        <p class="hint">Your contacts on ButterflAI see this in their Happenings until it ends — nobody gets pinged. You can also just tell your agent.</p>
        <h3>Friends</h3>${friends.length ? friends.map(feedItemHtml).join('') : '<div class="empty-state">No friends have shared anything right now.</div>'}`;
    } else if (k === 'creating') {
      body = creatingFullHtml(creating, creating_suggestions);
    } else {
      body = items && items.length ? items.map(feedItemHtml).join('') : EMPTY_HAPPENINGS;
    }
    document.getElementById('full-title').textContent = SECTIONS[k];
    document.getElementById('full-body').innerHTML = line + body;
  }

  // The open section lives in the address (#creating), so the phone's back button closes it.
  const openKey = () => { const k = location.hash.slice(1); return SECTIONS[k] ? k : null; };
  function showOpenSection() {
    const k = openKey(), el = document.getElementById('sec-full');
    el.hidden = !k; document.body.classList.toggle('full-open', !!k);
    if (k && feed) { renderFull(k); el.scrollTop = 0; }
  }
  function openSection(k) { if (openKey() !== k) location.hash = k; else showOpenSection(); }
  function closeSection() { if (history.length > 1 && openKey()) history.back(); else { history.replaceState(null, '', location.pathname); showOpenSection(); } }
  window.addEventListener('hashchange', showOpenSection);

  async function loadFeed() {
    try {
      feed = await fetch('/api/feed').then(r => r.json());
      // What Home was showing, for the feedback button (feedback.js).
      window.bflyFeedbackState = () => ({ screen: 'home', open_section: openKey(), feed });
      renderHome();
      if (openKey()) renderFull(openKey());
    } catch (_) {
      document.getElementById('feed').innerHTML = '<div class="empty-state">Could not load.</div>';
    }
  }

  async function sharePlan(text, until) {
    const r = await fetch('/api/plans', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, until }) });
    if (!r.ok) { alert('Could not share. Try again.'); return; }
    await loadFeed();
  }
  function quickShare(text, until) { return sharePlan(text, until); }
  function shareOther() {
    const input = document.getElementById('share-text');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    // How long it holds comes from the wording itself ("this weekend", "until friday").
    return sharePlan(text, text);
  }
  async function removePlan(id) {
    await fetch('/api/plans/' + id, { method: 'DELETE' });
    await loadFeed();
  }

  async function load() {
    await loadFeed();
    showOpenSection();
    loadOut(true);   // 🌴 I'm out: who's near you (and refresh where you are if you're out)
  }

  load();
</script>
  <script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
  <script src="/update-check.js"></script>
  <script src="/feedback.js"></script>
  <script src="/notify-prompt.js"></script>
  <script src="/name-prompt.js"></script>
  <script src="/install-prompt.js"></script>

</body>
</html>
