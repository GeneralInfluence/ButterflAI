<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ButterflAI">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <meta name="theme-color" content="#6c47ff">
  <title>ButterflAI — Creating</title>
  <!-- Creating: what we're making happen together, its own tab (🐛 #32, owner 2026-10-20: "let's
       have a new tab just for what we're creating together"), grouped by plan like the chat. -->
  <link rel="stylesheet" href="/plan-nav.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f2f2f7; color: #1c1c1e; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; padding: 0 20px; height: 56px; gap: 12px; position: sticky; top: 0; z-index: 10; }
    .logo { font-size: 22px; font-weight: 700; color: #1a1a1a; text-decoration: none; }
    header nav { margin-left: auto; display: flex; gap: 20px; }
    header nav a { font-size: 14px; color: #6c47ff; text-decoration: none; font-weight: 500; }
    #plan-top { position: sticky; top: 0; z-index: 9; }
    main { max-width: 640px; margin: 0 auto; padding: 12px 16px 32px; }
    .plan { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 12px 14px; margin-bottom: 14px; }
    .plan-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .plan-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; color: #1c1c1e; text-decoration: none; }
    .plan-sub { font-size: 12px; color: #8e8e93; margin-bottom: 6px; }
    .mini { flex-shrink: 0; font-size: 12px; color: #6c47ff; background: #ede9fe; border-radius: 999px; padding: 4px 10px; text-decoration: none; font-weight: 600; }
    ul.items { list-style: none; }
    ul.items li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid #f2f2f7; font-size: 15px; }
    ul.items li:first-child { border-top: none; }
    ul.items li.done .t { text-decoration: line-through; color: #8e8e93; }
    ul.items li.focus { background: #ede9fe; border-radius: 8px; padding-left: 6px; }
    ul.items input[type=checkbox] { width: 20px; height: 20px; accent-color: #6c47ff; flex-shrink: 0; }
    .t { flex: 1; min-width: 0; }
    .det { display: block; font-size: 12px; color: #6e6e76; }
    .who { font-size: 11px; color: #6c47ff; background: #ede9fe; border-radius: 999px; padding: 2px 8px; flex-shrink: 0; }
    .btn { flex-shrink: 0; border: 1px solid #e5e5e5; background: #fff; color: #3a3a3c; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-family: inherit; cursor: pointer; }
    .btn.primary { background: #6c47ff; border-color: #6c47ff; color: #fff; }
    .x { background: none; border: none; color: #c7c7cc; font-size: 16px; cursor: pointer; padding: 0 4px; }
    .label { font-size: 12px; color: #8e8e93; margin: 8px 0 2px; }
    .idea { display: flex; align-items: center; gap: 6px; padding: 5px 0; font-size: 14px; }
    .idea span { flex: 1; min-width: 0; }
    .idea.focus { background: #ede9fe; border-radius: 8px; padding-left: 6px; }
    form.add { display: flex; gap: 8px; margin-top: 8px; }
    form.add input { flex: 1; min-width: 0; height: 36px; border: 1.5px solid #e5e5e5; border-radius: 999px; padding: 0 12px; font-size: 16px; font-family: inherit; }
    .empty { color: #8e8e93; font-size: 14px; text-align: center; padding: 32px 16px; }
    .bottom-nav { display: none; }
    @media (max-width: 640px) {
      header nav { display: none; }
      .logo { font-size: 18px; }
      body main { padding-bottom: calc(58px + env(safe-area-inset-bottom, 0px) + 48px); }
      .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 58px; background: #fff; border-top: 1px solid #e5e5e5;
        z-index: 100; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
      .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 500; color: #888; text-decoration: none; min-width: 48px; padding: 6px 2px; border-radius: 8px; }
      .bottom-nav a.active { color: #6c47ff; }
      .bottom-nav .tab-icon { font-size: 22px; line-height: 1; }
    }
  </style>
</head>
<body>
<div id="plan-top"><nav id="pills" aria-label="Plans"></nav><div id="modes"></div></div>
<main id="main"><div class="empty">Loading…</div></main>

<!-- Home · Plans · Settings (owner, 2026-10-20: the tabs were redundant with the pills and the
     switcher — Chat, Creating and Events are one place, Plans; People is in Settings). -->
<nav class="bottom-nav">
  <a href="/app/dashboard"><span class="tab-icon">🏠</span>Home</a>
  <a href="/app/explore"><span class="tab-icon">🧭</span>Explore</a>
  <a href="/app/chat" class="active" onclick="try{var u=localStorage.getItem('bfly-plans-last');if(u&&u.indexOf('/app/')===0){location.href=u;return false}}catch(e){}"><span class="tab-icon"><img src="/icons/butterfly-128.png" alt="ButterflAI" class="bfly-img" style="width:1.15em;height:1.15em;vertical-align:-0.18em;object-fit:contain"></span>Plans</a>
  <a href="/app/settings"><span class="tab-icon">⚙️</span>Settings</a>
</nav>

<script src="/plan-nav.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const planId = q.get('event');                       // one plan, or All
  const focusTodo = q.get('todo');                     // opened from Home for one item
  const focusSuggestions = q.get('focus') === 'suggestions';
  const day = /^\d{4}-\d{2}-\d{2}$/.test(q.get('day') || '') ? q.get('day') : null;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const STATUS = { idea: '', options: 'options found', chosen: 'chosen', booked: 'booked ✓' };
  let plans = [];
  let focused = false;

  // One item: details, who's on it; only its team checks it off or edits it — anyone else
  // taps "I'm on it" first (owner, 2026-10-19: no editing by accident).
  function itemHtml(t) {
    if (t.over && !t.done) return `<li class="done" data-id="${esc(t.id)}"><span class="t">${esc(t.shown || t.text)}<span class="det">Its time has passed</span></span></li>`;
    const det = [t.when_text, t.place && 'at ' + t.place, STATUS[t.status]].filter(Boolean).join(' · ');
    return `<li class="${t.done ? 'done' : ''}" data-id="${esc(t.id)}">
      ${t.yours ? `<input type="checkbox" ${t.done ? 'checked' : ''} aria-label="Done">` : ''}
      <span class="t">${esc(t.shown || t.text)}${det ? `<span class="det">${esc(det)}</span>` : ''}${t.notes ? `<span class="det">${esc(t.notes)}</span>` : ''}</span>
      ${t.ask === 'asked' ? `<span class="who" style="color:#f59e0b">asked ${esc(t.assignee || '')} — waiting</span>` : (t.team || []).length ? `<span class="who">${esc(t.team.join(', '))}${t.ask === 'on_it' ? ' ✓' : ''}</span>` : ''}
      ${t.done ? '' : `<button type="button" class="btn together" title="Make it its own little plan — figure it out together over a drink, coffee or a call">${t.together_event_id ? '🍻 Plan ›' : '🍻 Together'}</button>`}
      ${t.yours ? '<button type="button" class="x remove" aria-label="Remove">✕</button>' : '<button type="button" class="btn onit">I’m on it</button>'}</li>`;
  }
  function planHtml(p, data, full) {
    const kept = data.todos.filter((t) => !t.suggested), sug = data.todos.filter((t) => t.suggested), ideas = data.suggestions || [];
    const head = `<div class="plan-head">
        <a class="plan-title" href="/app/creating?event=${encodeURIComponent(p.event_id)}">${esc(p.title)}</a>
        ${full ? '' : `<a class="mini" href="/app/chat?event=${encodeURIComponent(p.event_id)}"><img class="ai-ico" src="/icons/butterfly-128.png" alt="" width="16" height="16"> ButterflAI</a><a class="mini" href="/app/events?event=${encodeURIComponent(p.event_id)}">📅 Details</a>`}</div>
      <div class="plan-sub">${esc(p.dates || '')}${kept.length ? ` · ${data.progress.done}/${data.progress.total} done` : ''}</div>`;
    const items = kept.length ? `<ul class="items">${kept.map(itemHtml).join('')}</ul>` : (full ? '<div class="plan-sub">Nothing yet — add what needs doing, or ask your ButterflAI what this plan needs.</div>' : '');
    const ideaHtml = ideas.length ? '<div class="label">💡 Suggestions</div>' + ideas.map((s) => `<div class="idea" data-sid="${esc(s.id)}"><span>${esc(s.from === 'you' ? 'You' : s.from)}${s.item ? ` on “${esc(s.item)}”` : ''}: ${esc(s.summary)}</span>${s.can_decide
      ? '<button type="button" class="btn primary accept">Accept</button><button type="button" class="btn decline">No</button>'
      : '<span style="font-size:12px;color:#8e8e93">waiting</span><button type="button" class="x withdraw" aria-label="Take back">✕</button>'}</div>`).join('') : '';
    const sugHtml = sug.length ? '<div class="label">Suggested by ButterflAI</div>' + sug.map((t) => `<div class="idea" data-id="${esc(t.id)}"><span>${esc(t.shown || t.text)}</span><button type="button" class="btn keep">Keep</button><button type="button" class="x remove" aria-label="Dismiss">✕</button></div>`).join('') : '';
    const add = full ? `<form class="add" data-event="${esc(p.event_id)}"><input maxlength="200" placeholder="Add something to make happen…" aria-label="Add to Creating"><button class="btn primary" type="submit">Add</button></form>` : '';
    return `<section class="plan" data-event="${esc(p.event_id)}">${head}${items}${ideaHtml}${sugHtml}${add}</section>`;
  }

  async function load() {
    const main = document.getElementById('main');
    // The same top as Chat and Events (plan-nav.js): plan pills, then Chat · Creating · Details.
    plans = await PlanNav.discussions();
    PlanNav.pills(document.getElementById('pills'), { page: 'creating', eventId: planId, discussions: plans });
    PlanNav.modes(document.getElementById('modes'), { page: 'creating', eventId: planId, day });
    const shown = planId ? plans.filter((p) => p.event_id === planId) : plans;
    if (planId && !shown.length) { main.innerHTML = '<div class="empty">This plan isn’t open any more. <a href="/app/creating">See everything</a></div>'; return; }
    const lists = await Promise.all(shown.map((p) => fetch('/api/events/' + encodeURIComponent(p.event_id) + '/todos').then((r) => (r.ok ? r.json() : null)).catch(() => null)));
    const html = shown.map((p, i) => {
      const d = lists[i];
      if (!d) return '';
      // In All: only plans that have something on them.
      if (!planId && !d.todos.length && !(d.suggestions || []).length) return '';
      if (!planId && d.over) return '';   // everything on it is done or its time has passed (2026-10-21)
      return planHtml(p, d, !!planId);
    }).join('');
    main.innerHTML = html || '<div class="empty">Nothing being created yet. Open a plan here (the pills above) to add what needs doing, or ask your ButterflAI what a plan needs.</div>';
    if (!focused && (focusTodo || focusSuggestions)) {
      focused = true;
      const el = focusTodo ? document.querySelector(`[data-id="${CSS.escape(focusTodo)}"]`) : document.querySelector('[data-sid]');
      if (el) { el.classList.add('focus'); el.scrollIntoView({ block: 'center' }); }
    }
  }
  async function call(method, url, body) {
    await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }).catch(() => {});
    load();
  }
  document.getElementById('main').addEventListener('click', (e) => {
    const s = e.target.closest('[data-sid]');
    if (s) {
      const url = '/api/suggestions/' + encodeURIComponent(s.dataset.sid);
      if (e.target.matches('.accept')) call('POST', url, { accept: true });
      else if (e.target.matches('.decline')) call('POST', url, { accept: false });
      else if (e.target.matches('.withdraw')) call('DELETE', url);
      return;
    }
    const row = e.target.closest('[data-id]');
    if (!row) return;
    const url = '/api/todos/' + encodeURIComponent(row.dataset.id);
    if (e.target.matches('input[type=checkbox]')) call('PATCH', url, { done: e.target.checked });
    else if (e.target.matches('.keep')) call('PATCH', url, { keep: true });
    else if (e.target.matches('.onit')) call('POST', url + '/join');
    else if (e.target.matches('.together')) {   // 🐛 #44: do it together → its own plan, opened in chat
      e.target.disabled = true;
      fetch(url + '/together', { method: 'POST' }).then((r) => r.json()).then((d) => { if (d.event_id) location.href = '/app/chat?event=' + encodeURIComponent(d.event_id); else { e.target.disabled = false; alert(d.message || 'Couldn’t make the plan'); } }).catch(() => { e.target.disabled = false; });
    }
    else if (e.target.matches('.remove')) call('DELETE', url);
  });
  document.getElementById('main').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target.closest('form.add'); if (!f) return;
    const input = f.querySelector('input'); const text = input.value.trim(); if (!text) return;
    input.value = '';
    call('POST', '/api/events/' + encodeURIComponent(f.dataset.event) + '/todos', { text, ...(day ? { day } : {}) });
  });
  window.bflyFeedbackState = () => ({ screen: 'creating', event_id: planId || null, plans: plans.map((p) => ({ id: p.event_id, title: p.title })) });
  load();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
<script src="/update-check.js"></script>
<script src="/feedback.js"></script>
<script src="/notify-prompt.js"></script>
<script src="/name-prompt.js"></script>
</body>
</html>
