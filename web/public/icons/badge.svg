<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Solid white butterfly silhouette for the Android notification status-bar badge.
       Android renders the badge from the alpha channel and tints it, so it must be a
       flat single-color shape — the ButterflAI butterfly, recognizable at a glance. -->
  <g fill="#ffffff">
    <path d="M100 95 C85 75, 45 55, 20 60 C5 63, 2 80, 8 95 C14 110, 38 118, 60 110 C75 105, 90 100, 100 95 Z"/>
    <path d="M100 105 C88 108, 60 118, 38 130 C22 138, 20 155, 30 162 C42 170, 65 162, 80 150 C92 140, 98 120, 100 105 Z"/>
    <path d="M100 95 C115 75, 155 55, 180 60 C195 63, 198 80, 192 95 C186 110, 162 118, 140 110 C125 105, 110 100, 100 95 Z"/>
    <path d="M100 105 C112 108, 140 118, 162 130 C178 138, 180 155, 170 162 C158 170, 135 162, 120 150 C108 140, 102 120, 100 105 Z"/>
    <ellipse cx="100" cy="100" rx="6" ry="44"/>
    <circle cx="77" cy="26" r="5"/>
    <circle cx="123" cy="26" r="5"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
    <path d="M98 62 C94 48, 82 38, 78 28"/>
    <path d="M102 62 C106 48, 118 38, 122 28"/>
  </g>
</svg>
